    <rect x="146" y="272" width="220" height="20" rx="10" fill="#0B1020"/>
    <path d="M156 276 h84 a12 12 0 0 1 12 12 v22 a26 26 0 0 1-26 26 h-44 a30 30 0 0 1-30-26 l-6-22 a10 10 0 0 1 10-12z" fill="url(#gh-glass)"/>
    <path d="M356 276 h-84 a12 12 0 0 0-12 12 v22 a26 26 0 0 0 26 26 h44 a30 30 0 0 0 30-26 l6-22 a10 10 0 0 0-10-12z" fill="url(#gh-glass)"/>
    <path d="M168 286 l50 0 -34 40 -22 0z" fill="#fff" opacity="0.35"/>
    <path d="M284 286 l50 0 -34 40 -22 0z" fill="#fff" opacity="0.35"/>
  </g>
  <!-- sourire -->
  <path d="M212 356 c26 34 62 34 88 0 z" fill="#fff"/>
  <path d="M234 378 c14 12 30 12 44 0 -14-6-30-6-44 0z" fill="#FF3B6B"/>

  <!-- haltère -->
