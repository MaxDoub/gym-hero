    <radialGradient id="gh-bell" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#4A5468"/>
      <stop offset="0.55" stop-color="#232B3D"/>
      <stop offset="1" stop-color="#11151F"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#gh-bg)"/>
