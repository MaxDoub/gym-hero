  <path d="M40 330 C150 250 250 300 400 200 L470 250 C330 350 220 330 60 400 Z" fill="url(#gh-streak)" opacity="0.85"/>
  <path d="M60 150 C170 90 260 160 420 90 L470 130 C320 210 210 160 70 210 Z" fill="#FF2D8A" opacity="0.45"/>

