<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gym Hero">
  <defs>
    <linearGradient id="gh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.38" stop-color="#2B6BFF"/>
      <stop offset="0.72" stop-color="#7B2BFF"/>
      <stop offset="1" stop-color="#FF2D8A"/>
    </linearGradient>
    <linearGradient id="gh-streak" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC531"/>
      <stop offset="1" stop-color="#FF7A18"/>
    </linearGradient>
    <linearGradient id="gh-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#2B6BFF"/>
      <stop offset="1" stop-color="#FF2D8A"/>
    </linearGradient>
    <linearGradient id="gh-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C8798"/>
      <stop offset="0.5" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#68727F"/>
